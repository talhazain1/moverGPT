<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile - Admin Panel</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
  <div class="alert-container"></div>

  <div class="admin-layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand">
          <img id="sidebarLogo" src="https://ui-avatars.com/api/?name=Company&background=random" alt="Logo" class="sidebar-logo" style="width: 32px; height: 32px; border-radius: 50%; margin-right: 10px;">
          <span id="sidebarCompanyName">Loading...</span>
        </div>
        <button class="sidebar-toggle">
          <i class="fas fa-bars"></i>
        </button>
      </div>
      
      <ul class="sidebar-menu">
        <li class="sidebar-item">
          <a href="/static/dashboard.html" class="sidebar-link">
            <i class="fas fa-tachometer-alt"></i>
            <span>Dashboard</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="/static/profile.html" class="sidebar-link active">
            <i class="fas fa-user-circle"></i>
            <span>Profile</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="/static/chatbot_builder.html" class="sidebar-link">
            <i class="fas fa-robot"></i>
            <span>Chatbot Builder</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="/static/test.html" class="sidebar-link">
            <i class="fas fa-vial"></i>
            <span>Test Chatbot</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="/static/cost_calculator.html" class="sidebar-link">
            <i class="fas fa-calculator"></i>
            <span>Moving Cost Calculator</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="/static/moving_parameters.html" class="sidebar-link">
            <i class="fas fa-sliders-h"></i>
            <span>Moving Parameters</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="/static/chat_analysis.html" class="sidebar-link">
            <i class="fas fa-comments-dollar"></i>
            <span>Chat Analysis</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="/static/pricing.html" class="sidebar-link">
            <i class="fas fa-tag"></i>
            <span>Pricing Plans</span>
          </a>
        </li>
        <li class="sidebar-item">
          <a href="#" id="logoutBtn" class="sidebar-link">
            <i class="fas fa-sign-out-alt"></i>
            <span>Logout</span>
          </a>
        </li>
      </ul>
    </div>    
    <!-- Main Content -->
    <div class="main-content">
      <!-- Header -->
      <div class="main-header">
        <div class="header-left">
          <!-- <button class="header-toggle d-lg-none">
            <i class="fas fa-bars"></i>
          </button>
          <h4>Profile</h4> -->
        </div>
        
        <div class="header-right">
          <div class="user-dropdown">
            <div class="user-info">
              <div>
                <div class="user-name">User</div>
                <div class="user-role">Member</div>
              </div>
              <img src="https://ui-avatars.com/api/?name=User&background=random" alt="User" class="user-avatar">
            </div>
          </div>
        </div>
      </div>
      
      <!-- Page Container -->
      <div class="page-container">
        <div class="card">
          <div class="card-header">
            <h5 class="card-title">Profile Information</h5>
          </div>
          <div class="card-body">
            <form id="updateProfileForm">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="user_name">Name</label>
                    <input type="text" id="user_name" name="user_name" class="form-control">
                  </div>
                </div>
                
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="user_phone">Phone</label>
                    <input type="text" id="user_phone" name="user_phone" class="form-control">
                  </div>
                </div>
                
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="company_name">Company Name</label>
                    <input type="text" id="company_name" name="company_name" class="form-control">
                  </div>
                </div>
                
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="company_phone">Company Phone</label>
                    <input type="text" id="company_phone" name="company_phone" class="form-control">
                  </div>
                </div>
                
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="company_website">Company Website</label>
                    <input type="text" id="company_website" name="company_website" class="form-control">
                  </div>
                </div>
                
                <div class="col-md-6">
                  <div class="form-group">
                    <label for="niche">Niche</label>
                    <input type="text" id="niche" name="niche" class="form-control">
                  </div>
                </div>
                
                <div class="col-md-12">
                  <div class="form-group">
                    <label for="business_address">Business Address</label>
                    <textarea id="business_address" name="business_address" class="form-control"></textarea>
                  </div>
                </div>
              </div>
              
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-save"></i> Update Profile
              </button>
            </form>
            
            <h5 class="mt-4 mb-3">Upload Company Logo</h5>
            <form id="uploadLogoForm" enctype="multipart/form-data">
              <div class="form-group">
                <label for="logo">Choose Logo (PNG/JPG)</label>
                <input type="file" id="logo" name="logo" accept=".png,.jpg,.jpeg" required class="form-control">
              </div>
              <button type="submit" class="btn btn-primary">
                <i class="fas fa-upload"></i> Upload Logo
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/assets/auth.js"></script>
  <script>
    // Function to update sidebar company info
    function updateSidebarCompanyInfo(user) {
      // Update company name in sidebar
      const companyNameElement = document.getElementById('sidebarCompanyName');
      if (companyNameElement) {
        companyNameElement.textContent = user.company_name || 'Company Admin';
      }
      
      // Update logo in sidebar
      const sidebarLogoElement = document.getElementById('sidebarLogo');
      if (sidebarLogoElement) {
        if (user.company_logo) {
          sidebarLogoElement.src = user.company_logo;
        } else {
          // Generate avatar based on company name
          const companyName = user.company_name || 'Company';
          sidebarLogoElement.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(companyName)}&background=random`;
        }
      }
    }

    // Initialize profile page
    (async function initProfile() {
      try {
        const user = await checkAuth();
        if (!user) {
          window.location.href = '/static/login.html';
          return;
        }

        // Update sidebar with company info
        updateSidebarCompanyInfo(user);
        
        // Update user info in header
        document.querySelector('.user-name').textContent = user.user_name || 'User';
        document.querySelector('.user-role').textContent = user.role || 'Member';
        
        // Update avatar with fallback to default if no logo
        const avatarImg = document.querySelector('.user-avatar');
        if (user.company_logo) {
          avatarImg.src = user.company_logo;
        } else {
          avatarImg.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.user_name || 'User')}&background=random`;
        }

        // Populate form with user data
        document.getElementById('user_name').value = user.user_name || '';
        document.getElementById('user_phone').value = user.user_phone || '';
        document.getElementById('company_name').value = user.company_name || '';
        document.getElementById('company_phone').value = user.company_phone || '';
        document.getElementById('business_address').value = user.business_address || '';
        document.getElementById('company_website').value = user.company_website || '';
        document.getElementById('niche').value = user.niche || '';

        // Add logout handler
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
          e.preventDefault();
          logout();
        });

        // Handle profile update
        document.getElementById('updateProfileForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const formData = {
            user_name: document.getElementById('user_name').value,
            user_phone: document.getElementById('user_phone').value,
            company_name: document.getElementById('company_name').value,
            company_phone: document.getElementById('company_phone').value,
            business_address: document.getElementById('business_address').value,
            company_website: document.getElementById('company_website').value,
            niche: document.getElementById('niche').value
          };
          
          try {
            const response = await fetch('/api/users/update_profile', {
              method: 'PUT',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify(formData)
            });
            
            const data = await response.json();
            
            if (data.status === 'success' && data.user) {
              // Update sidebar with new company info
              updateSidebarCompanyInfo(data.user);
              
              // Update user info in header
              document.querySelector('.user-name').textContent = data.user.user_name || 'User';
              document.querySelector('.user-avatar').src = data.user.company_logo || 
                `https://ui-avatars.com/api/?name=${encodeURIComponent(data.user.user_name || 'User')}&background=random`;
              
              // Show success message
              showAlert('Profile updated successfully!', 'success');
            } else {
              showAlert(data.message || 'Failed to update profile', 'danger');
            }
          } catch (error) {
            console.error('Error updating profile:', error);
            showAlert('Error updating profile: ' + error.message, 'danger');
          }
        });

        // Handle logo upload
        document.getElementById('uploadLogoForm').addEventListener('submit', async function(e) {
          e.preventDefault();
          
          const formData = new FormData(this);
          
          try {
            const response = await fetch('/api/users/upload_logo', {
              method: 'POST',
              credentials: 'include',
              body: formData
            });
            
            const data = await response.json();
            
            if (data.status === 'success' && data.user) {
              // Update sidebar logo
              const sidebarLogo = document.getElementById('sidebarLogo');
              if (sidebarLogo && data.user.company_logo) {
                sidebarLogo.src = data.user.company_logo;
              }
              
              // Update user avatar in header
              const userAvatar = document.querySelector('.user-avatar');
              if (userAvatar && data.user.company_logo) {
                userAvatar.src = data.user.company_logo;
              }
              
              // Show success message
              showAlert('Logo uploaded successfully!', 'success');
            } else {
              showAlert(data.message || 'Failed to upload logo', 'danger');
            }
          } catch (error) {
            console.error('Error uploading logo:', error);
            showAlert('Error uploading logo: ' + error.message, 'danger');
          }
        });
      } catch (error) {
        console.error('Error initializing profile:', error);
        showAlert('Error loading profile data', 'danger');
      }
    })();

    // Show alert messages
    function showAlert(message, type) {
      const alertContainer = document.querySelector('.alert-container');
      
      // Create alert element
      const alert = document.createElement('div');
      alert.className = `alert alert-${type}`;
      alert.innerHTML = `<span>${message}</span><button type="button" class="close" aria-label="Close">&times;</button>`;
      
      // Add close button functionality
      const closeButton = alert.querySelector('.close');
      closeButton.addEventListener('click', function() {
        alert.remove();
      });
      
      // Add to container
      alertContainer.appendChild(alert);
      
      // Auto-remove after 5 seconds for non-error alerts
      if (type !== 'danger') {
        setTimeout(() => {
          if (alert.parentNode) {
            alert.remove();
          }
        }, 5000);
      }
    }
  </script>
</body>
</html>
