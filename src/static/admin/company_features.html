<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Company Features Management - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <script src="/admin/js/auth.js"></script>
    <style>
        .sidebar {
            min-height: 100vh;
            background-color: #343a40;
        }
        .sidebar .nav-link {
            color: rgba(255,255,255,.75);
        }
        .sidebar .nav-link:hover {
            color: #fff;
        }
        .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255,255,255,.1);
        }
        .feature-card {
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            background: white;
        }
        .feature-card:hover {
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .feature-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .feature-title {
            font-weight: 600;
            margin: 0;
        }
        .feature-description {
            color: #6c757d;
            font-size: 0.9em;
            margin-bottom: 10px;
        }
        .feature-limits {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #dee2e6;
        }
        .limit-input {
            width: 100px;
            display: inline-block;
        }
    </style>
</head>
<body class="bg-light">
    <!-- Dashboard header with logo and logout button -->
    <header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
        <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="/admin/dashboard.html">Admin Panel</a>
        <button class="navbar-toggler position-absolute d-md-none collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="navbar-nav">
            <div class="nav-item text-nowrap">
                <a class="nav-link px-3" href="#" id="logout-btn">Sign out</a>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="text-white">Admin Panel</h4>
                    </div>
                    <ul class="nav flex-column">
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/dashboard.html">
                                <i class="bi bi-speedometer2 me-2"></i>Dashboard
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/dashboard.html#users">
                                <i class="bi bi-people-fill me-2"></i>Users
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/dashboard.html#team">
                                <i class="bi bi-people me-2"></i>Team Members
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/dashboard.html#companies">
                                <i class="bi bi-building me-2"></i>Companies
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/admin/company_features.html">
                                <i class="bi bi-toggles me-2"></i>Company Features
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/dashboard.html#payments">
                                <i class="bi bi-credit-card me-2"></i>Payments
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/dashboard.html#apis">
                                <i class="bi bi-code-slash me-2"></i>APIs
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/dashboard.html#support">
                                <i class="bi bi-headset me-2"></i>Support
                            </a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" id="sidebar-logout-btn">
                                <i class="bi bi-box-arrow-right me-2"></i>Logout
                            </a>
                        </li>
                    </ul>
                </div>
            </div>

            <!-- Main content -->
            <div class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div class="pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Company Feature Management</h1>
                </div>
                <div class="container-fluid py-4">
                    <div class="row">
                        <div class="col-md-3">
                            <div class="card">
                                <div class="card-header">
                                    <h5 class="mb-0">Companies</h5>
                                </div>
                                <div class="card-body">
                                    <div class="list-group" id="companyList">
                                        <!-- Companies will be loaded here -->
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-9">
                            <!-- No company selected message -->
                            <div id="noCompanySelected" class="alert alert-info">
                                <p>Please select a company from the list to manage its features.</p>
                            </div>
                            
                            <!-- Features section -->
                            <div id="featuresSection" style="display: none;">
                                <div class="d-flex justify-content-between align-items-center mb-4">
                                    <h5>Feature Management</h5>
                                    <div>
                                        <button class="btn btn-warning me-2" onclick="resetToPlanDefaults()">Reset to Defaults</button>
                                        <button class="btn btn-primary" onclick="saveFeatures()">Save Changes</button>
                                    </div>
                                </div>
                                <div id="featuresContainer">
                                    <!-- Features will be loaded here -->
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Add event listener for logout
        document.getElementById('logout-btn').addEventListener('click', async () => {
            try {
                const response = await fetch('/api/admin/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                if (response.ok) {
                    window.location.href = '/admin/login.html';
                } else {
                    console.error('Logout failed');
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
        });
        
        // Also add for sidebar logout button
        document.getElementById('sidebar-logout-btn').addEventListener('click', async (e) => {
            e.preventDefault();
            try {
                const response = await fetch('/api/admin/logout', {
                    method: 'POST',
                    credentials: 'include'
                });
                if (response.ok) {
                    window.location.href = '/admin/login.html';
                } else {
                    console.error('Logout failed');
                }
            } catch (error) {
                console.error('Logout error:', error);
            }
        });

        // Feature definitions
        let features = {
            chatbot: {
                title: "Chatbot",
                description: "Enable AI-powered chatbot functionality",
                plans: ["basic", "pro", "enterprise"]
            },
            knowledge_base: {
                title: "Knowledge Base",
                description: "Create and manage knowledge base articles",
                plans: ["basic", "pro", "enterprise"],
                limits: {
                    documents: {
                        title: "Maximum Documents",
                        basic: 50,
                        pro: 200,
                        enterprise: Infinity
                    }
                }
            },
            support_tickets: {
                title: "Support Tickets",
                description: "Create and manage support tickets",
                plans: ["basic", "pro", "enterprise"],
                limits: {
                    per_month: {
                        title: "Tickets per Month",
                        basic: 10,
                        pro: 50,
                        enterprise: Infinity
                    }
                }
            },
            api_access: {
                title: "API Access",
                description: "Access to API endpoints",
                plans: ["pro", "enterprise"],
                limits: {
                    calls_per_month: {
                        title: "API Calls per Month",
                        pro: 1000,
                        enterprise: Infinity
                    }
                }
            },
            custom_branding: {
                title: "Custom Branding",
                description: "Customize chatbot appearance and branding",
                plans: ["pro", "enterprise"]
            },
            analytics: {
                title: "Analytics",
                description: "Access to detailed analytics and reports",
                plans: ["pro", "enterprise"]
            },
            multi_language: {
                title: "Multi-language Support",
                description: "Support for multiple languages",
                plans: ["pro", "enterprise"],
                limits: {
                    languages: {
                        title: "Number of Languages",
                        pro: 3,
                        enterprise: Infinity
                    }
                }
            },
            advanced_ai: {
                title: "Advanced AI",
                description: "Access to advanced AI features and customization",
                plans: ["enterprise"]
            },
            priority_support: {
                title: "Priority Support",
                description: "24/7 priority support access",
                plans: ["enterprise"]
            },
            custom_integrations: {
                title: "Custom Integrations",
                description: "Custom API integrations and webhooks",
                plans: ["enterprise"]
            }
        };

        async function loadCompanies() {
            try {
                document.getElementById('companyList').innerHTML = `
                    <div class="alert alert-info">
                        Loading companies...
                    </div>
                `;
                
                const response = await fetch('/api/admin/companies', {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (!response.ok) {
                    throw new Error(`Failed to load companies: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (!data.companies || !data.companies.length) {
                    document.getElementById('companyList').innerHTML = `
                        <div class="alert alert-warning">
                            No companies found in the database.
                        </div>
                    `;
                    return Promise.resolve(); // Resolve even if no companies found
                }
                
                const companyList = document.getElementById('companyList');
                companyList.innerHTML = data.companies.map(company => `
                    <a href="#" class="list-group-item list-group-item-action" 
                       onclick="loadCompanyFeatures(${company.id})"
                       data-company-id="${company.id}">
                        ${company.company_name}
                        <span class="badge bg-primary float-end">${company.subscription_plan || 'basic'}</span>
                    </a>
                `).join('');
                
                // Show the no company selected message initially
                document.getElementById('featuresSection').style.display = 'none';
                document.getElementById('noCompanySelected').style.display = 'block';
                
                return Promise.resolve(); // Resolve when done
            } catch (error) {
                console.error('Error loading companies:', error);
                document.getElementById('companyList').innerHTML = `
                    <div class="alert alert-danger">
                        Failed to load companies: ${error.message}
                    </div>
                `;
                showError(`Failed to load companies: ${error.message}`);
                return Promise.reject(error); // Reject the promise on error
            }
        }

        async function loadCompanyFeatures(companyId) {
            if (!companyId) {
                showError('Invalid company ID');
                return;
            }
            
            currentCompanyId = companyId;
            
            try {
                // Show loading state
                document.getElementById('featuresSection').style.display = 'none';
                document.getElementById('noCompanySelected').style.display = 'block';
                document.getElementById('noCompanySelected').innerHTML = `
                    <div class="alert alert-info">
                        <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                        Loading features for company ID ${companyId}...
                    </div>
                `;
                
                const response = await fetch(`/api/admin/companies/${companyId}/features`, {
                    method: 'GET',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                if (response.status === 404) {
                    // Company not found
                    document.getElementById('noCompanySelected').innerHTML = `
                        <div class="alert alert-warning">
                            <i class="bi bi-exclamation-triangle-fill"></i>
                            Company with ID ${companyId} was not found in the database.
                        </div>
                    `;
                    // Try to reload the company list
                    loadCompanies();
                    return;
                }
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Error loading features: ${response.status}`);
                }
                
                const data = await response.json();
                
                // Ensure we have valid data structures even if the backend returns null/undefined
                const enabledFeatures = data.enabled_features || {};
                const featureLimits = data.feature_limits || {};
                const subscriptionPlan = data.subscription_plan || 'basic';
                
                const featuresContainer = document.getElementById('featuresContainer');
                featuresContainer.innerHTML = Object.entries(features).map(([key, feature]) => {
                    const isEnabled = enabledFeatures[key] || false;
                    const planLimits = feature.limits ? Object.entries(feature.limits).map(([limitKey, limit]) => {
                        const defaultValue = limit[subscriptionPlan] || 0;
                        const currentValue = featureLimits[limitKey] !== undefined ? featureLimits[limitKey] : defaultValue;
                        return `
                            <div class="mb-2">
                                <label class="form-label">${limit.title}</label>
                                <input type="number" 
                                       class="form-control limit-input" 
                                       id="limit_${key}_${limitKey}"
                                       value="${currentValue === Infinity ? '' : currentValue}"
                                       ${!isEnabled ? 'disabled' : ''}>
                            </div>
                        `;
                    }).join('') : '';

                    return `
                        <div class="feature-card">
                            <div class="feature-header">
                                <div>
                                    <h6 class="feature-title">${feature.title}</h6>
                                    <p class="feature-description">${feature.description}</p>
                                </div>
                                <div class="form-check form-switch">
                                    <input class="form-check-input" 
                                           type="checkbox" 
                                           id="feature_${key}"
                                           ${isEnabled ? 'checked' : ''}
                                           onchange="toggleFeature('${key}', this.checked)">
                                </div>
                            </div>
                            ${planLimits ? `<div class="feature-limits">${planLimits}</div>` : ''}
                        </div>
                    `;
                }).join('');

                // Update active company in list
                document.querySelectorAll('#companyList .list-group-item').forEach(item => {
                    item.classList.remove('active');
                    if (item.dataset.companyId === companyId.toString()) {
                        item.classList.add('active');
                    }
                });
                
                // Show the features container and actions
                document.getElementById('featuresSection').style.display = 'block';
                document.getElementById('noCompanySelected').style.display = 'none';
            } catch (error) {
                console.error('Error loading company features:', error);
                
                // Display a more helpful error message
                document.getElementById('noCompanySelected').innerHTML = `
                    <div class="alert alert-danger">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                        Failed to load company features: ${error.message}
                        <button class="btn btn-sm btn-outline-primary mt-2" onclick="loadCompanies()">
                            Reload Companies
                        </button>
                    </div>
                `;
                document.getElementById('noCompanySelected').style.display = 'block';
                document.getElementById('featuresSection').style.display = 'none';
            }
        }

        function toggleFeature(featureKey, enabled) {
            const feature = features[featureKey];
            if (feature.limits) {
                Object.keys(feature.limits).forEach(limitKey => {
                    const input = document.getElementById(`limit_${featureKey}_${limitKey}`);
                    input.disabled = !enabled;
                });
            }
        }

        async function saveFeatures() {
            if (!currentCompanyId) {
                showError('Please select a company first');
                return;
            }

            const enabledFeatures = {};
            const featureLimits = {};

            Object.keys(features).forEach(key => {
                const checkbox = document.getElementById(`feature_${key}`);
                enabledFeatures[key] = checkbox.checked;

                if (features[key].limits) {
                    Object.keys(features[key].limits).forEach(limitKey => {
                        const input = document.getElementById(`limit_${key}_${limitKey}`);
                        featureLimits[limitKey] = input.value === '' ? Infinity : parseInt(input.value);
                    });
                }
            });

            try {
                const response = await fetch(`/api/admin/companies/${currentCompanyId}/features`, {
                    method: 'PUT',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        enabled_features: enabledFeatures,
                        feature_limits: featureLimits
                    })
                });

                if (response.ok) {
                    showSuccess('Features updated successfully');
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to update features');
                }
            } catch (error) {
                console.error('Error saving features:', error);
                showError(`Failed to save features: ${error.message}`);
            }
        }

        async function resetToPlanDefaults() {
            if (!currentCompanyId) {
                showError('Please select a company first');
                return;
            }

            if (!confirm('Are you sure you want to reset all features to plan defaults? This cannot be undone.')) {
                return;
            }

            try {
                const response = await fetch(`/api/admin/companies/${currentCompanyId}/features/reset`, {
                    method: 'POST',
                    credentials: 'same-origin',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });

                if (response.ok) {
                    const data = await response.json();
                    showSuccess(data.message);
                    loadCompanyFeatures(currentCompanyId);
                } else {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to reset features');
                }
            } catch (error) {
                console.error('Error resetting features:', error);
                showError(`Failed to reset features: ${error.message}`);
            }
        }

        function showError(message) {
            // Better error notification
            const toast = document.createElement('div');
            toast.className = 'toast align-items-center text-white bg-danger border-0 position-fixed top-0 end-0 m-3';
            toast.setAttribute('role', 'alert');
            toast.setAttribute('aria-live', 'assertive');
            toast.setAttribute('aria-atomic', 'true');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi bi-exclamation-triangle-fill"></i> ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            document.body.appendChild(toast);
            new bootstrap.Toast(toast).show();
            setTimeout(() => toast.remove(), 3000);
        }

        function showSuccess(message) {
            // Better success notification
            const toast = document.createElement('div');
            toast.className = 'toast align-items-center text-white bg-success border-0 position-fixed top-0 end-0 m-3';
            toast.setAttribute('role', 'alert');
            toast.setAttribute('aria-live', 'assertive');
            toast.setAttribute('aria-atomic', 'true');
            toast.innerHTML = `
                <div class="d-flex">
                    <div class="toast-body">
                        <i class="bi bi-check-circle-fill"></i> ${message}
                    </div>
                    <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
                </div>
            `;
            document.body.appendChild(toast);
            new bootstrap.Toast(toast).show();
            setTimeout(() => toast.remove(), 3000);
        }

        // Load companies when page loads
        document.addEventListener('DOMContentLoaded', async () => {
            console.log("Company features page loaded.");
            
            // First check authentication
            try {
                await checkAuthStatus();
            } catch (error) {
                console.error('Authentication check failed:', error);
                return; // Stop execution if not authenticated
            }
            
            const urlParams = new URLSearchParams(window.location.search);
            const companyId = urlParams.get('id');
            console.log(`URL parameters: ${window.location.search}, company ID: ${companyId}`);
            
            // If there's a company ID, focus on features management
            if (companyId) {
                // Hide the "no company selected" message
                document.getElementById('noCompanySelected').style.display = 'none';
                document.getElementById('featuresSection').style.display = 'block';
                
                // Load features for this company
                loadCompanyFeatures(companyId);
            } else {
                // Show "no company selected" message and load the company list
                document.getElementById('featuresSection').style.display = 'none';
                document.getElementById('noCompanySelected').style.display = 'block';
                
                // Load companies list
                loadCompanies()
                    .catch(error => {
                        console.error('Error loading companies:', error);
                    });
            }

            // Handle hash-based navigation
            handleHashNavigation();
        });

        // Add function to handle hash-based navigation
        function handleHashNavigation() {
            // Get the current hash (without the # symbol)
            const hash = window.location.hash.substring(1);
            
            // If there's a hash and it corresponds to a section, navigate to it
            if (hash) {
                const sectionLink = document.querySelector(`.nav-link[data-section="${hash}"]`);
                if (sectionLink) {
                    sectionLink.click(); // Trigger the click event to navigate to the section
                }
            }
        }

        // Call this when the hash changes
        window.addEventListener('hashchange', handleHashNavigation);
        
        // Check auth status
        async function checkAuthStatus() {
            try {
                const response = await fetch('/api/admin/check-auth', {
                    method: 'GET',
                    credentials: 'include'
                });
                
                if (!response.ok) {
                    window.location.href = '/admin/login.html';
                    return;
                }
                
                const data = await response.json();
                if (!data.authenticated) {
                    window.location.href = '/admin/login.html';
                }
            } catch (error) {
                console.error('Auth check failed:', error);
                window.location.href = '/admin/login.html';
            }
        }
        
        let currentCompanyId = null;
    </script>
</body>
</html>
