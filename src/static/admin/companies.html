<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Company Management - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/admin/css/admin.css">
    <script src="/static/admin/js/auth.js"></script>
</head>
<body class="bg-light">
    <!-- Dashboard header with logo and logout button -->
    <header class="navbar navbar-dark sticky-top bg-dark flex-md-nowrap p-0 shadow">
        <a class="navbar-brand col-md-3 col-lg-2 me-0 px-3" href="/admin/dashboard.html">Admin Panel</a>
        <button class="navbar-toggler position-absolute d-md-none collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="navbar-nav">
            <div class="nav-item text-nowrap">
                <a class="nav-link px-3" href="#" id="logout-btn">Sign out</a>
            </div>
        </div>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 d-md-block sidebar collapse">
                <div class="position-sticky pt-3">
                    <div class="text-center mb-4">
                        <h4 class="text-white">Admin Panel</h4>
                    </div>
                    <ul class="nav flex-column" id="sidebar-nav">
                        <!-- Sidebar will be populated by admin-nav.js -->
                    </ul>
                </div>
            </div>

            <!-- Main content -->
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <div id="alerts-container" class="mt-3"></div>
                
                <!-- Companies header -->
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Company Management</h1>
                    <div class="btn-toolbar mb-2 mb-md-0">
                        <div class="btn-group me-2">
                            <button type="button" class="btn btn-sm btn-outline-primary" id="exportCompanies">
                                <i class="bi bi-download"></i> Export CSV
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-secondary" id="refreshCompanies">
                                <i class="bi bi-arrow-repeat"></i> Refresh
                            </button>
                        </div>
                    </div>
                </div>
                
                <!-- Company list / Company details container -->
                <div class="row">
                    <!-- Company list -->
                    <div id="companyListContainer" class="col-md-12">
                        <!-- Search and filters -->
                        <div class="card mb-4">
                            <div class="card-body">
                                <div class="row">
                                    <div class="col-md-4 mb-2">
                                        <input type="text" class="form-control" id="searchCompany" placeholder="Search companies...">
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <select class="form-select" id="filterPlan">
                                            <option value="">All Plans</option>
                                            <option value="basic">Basic</option>
                                            <option value="pro">Pro</option>
                                            <option value="enterprise">Enterprise</option>
                                        </select>
                                    </div>
                                    <div class="col-md-3 mb-2">
                                        <select class="form-select" id="filterStatus">
                                            <option value="">All Status</option>
                                            <option value="active">Active</option>
                                            <option value="inactive">Inactive</option>
                                            <option value="pending">Pending</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2 mb-2">
                                        <button class="btn btn-primary w-100" id="applyFilters">
                                            <i class="bi bi-funnel"></i> Filter
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Companies table -->
                        <div class="card shadow">
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-striped">
                                        <thead>
                                            <tr>
                                                <th>Company Name</th>
                                                <th>Contact Email</th>
                                                <th>Contact Phone</th>
                                                <th>Subscription</th>
                                                <th>Status</th>
                                                <th>Features</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="companiesTable">
                                            <tr>
                                                <td colspan="7" class="text-center">Loading companies data...</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Company details - will be shown when a company is selected -->
                    <div id="companyDetailsContainer" class="col-md-12 mt-4" style="display: none;">
                        <div class="card shadow">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Company Details</h5>
                                <button class="btn btn-outline-secondary btn-sm" id="backToCompanyList">
                                    <i class="bi bi-arrow-left"></i> Back to Company List
                                </button>
                            </div>
                            <div class="card-body">
                                <form id="companyDetailsForm">
                                    <input type="hidden" id="companyId">
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="companyName" class="form-label">Company Name</label>
                                            <input type="text" class="form-control" id="companyName">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="contactEmail" class="form-label">Contact Email</label>
                                            <input type="email" class="form-control" id="contactEmail">
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-6">
                                            <label for="contactPhone" class="form-label">Contact Phone</label>
                                            <input type="text" class="form-control" id="contactPhone">
                                        </div>
                                        <div class="col-md-6">
                                            <label for="website" class="form-label">Website</label>
                                            <input type="text" class="form-control" id="website">
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-12">
                                            <label for="businessAddress" class="form-label">Business Address</label>
                                            <textarea class="form-control" id="businessAddress" rows="2"></textarea>
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-4">
                                            <label for="niche" class="form-label">Business Niche</label>
                                            <input type="text" class="form-control" id="niche">
                                        </div>
                                        <div class="col-md-4">
                                            <label for="subscriptionPlan" class="form-label">Subscription Plan</label>
                                            <select class="form-select" id="subscriptionPlan">
                                                <option value="basic">Basic</option>
                                                <option value="pro">Pro</option>
                                                <option value="enterprise">Enterprise</option>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <label for="status" class="form-label">Status</label>
                                            <select class="form-select" id="status">
                                                <option value="active">Active</option>
                                                <option value="inactive">Inactive</option>
                                                <option value="pending">Pending</option>
                                            </select>
                                        </div>
                                    </div>
                                    
                                    <div class="row mb-3">
                                        <div class="col-md-12">
                                            <h5>Actions</h5>
                                            <div class="btn-group">
                                                <button type="button" class="btn btn-outline-primary" id="viewFeatures">
                                                    <i class="bi bi-toggles"></i> Manage Features
                                                </button>
                                                <button type="button" class="btn btn-outline-info" id="viewPayments">
                                                    <i class="bi bi-credit-card"></i> View Payments
                                                </button>
                                                <button type="button" class="btn btn-outline-success" id="viewSupport">
                                                    <i class="bi bi-headset"></i> View Support Tickets
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <div class="row">
                                        <div class="col-md-12 d-flex justify-content-between">
                                            <button type="button" class="btn btn-danger" id="deleteCompanyBtn">
                                                <i class="bi bi-trash"></i> Delete Company
                                            </button>
                                            <div>
                                                <button type="button" class="btn btn-outline-secondary me-2" id="resetCompanyBtn">
                                                    Reset
                                                </button>
                                                <button type="submit" class="btn btn-primary" id="saveCompanyBtn">
                                                    <i class="bi bi-save"></i> Save Changes
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/admin/js/admin-nav.js"></script>
    
    <script>
        // Function to show alerts
        function showAlert(message, type = 'danger') {
            const alertsContainer = document.getElementById('alerts-container');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.role = 'alert';
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            
            alertsContainer.innerHTML = '';
            alertsContainer.appendChild(alertDiv);
            
            // Auto-dismiss success alerts after 3 seconds
            if (type === 'success') {
                setTimeout(() => {
                    alertDiv.classList.remove('show');
                    setTimeout(() => alertDiv.remove(), 150);
                }, 3000);
            }
        }

        // Global storage for companies data
        let companies = [];
        let currentCompany = null;

        // Load companies
        async function loadCompanies() {
            try {
                const companiesTable = document.getElementById('companiesTable');
                companiesTable.innerHTML = '<tr><td colspan="7" class="text-center"><span class="spinner-border spinner-border-sm" role="status"></span> Loading company data...</td></tr>';
                
                // Apply any filters
                const searchQuery = document.getElementById('searchCompany').value.toLowerCase();
                const planFilter = document.getElementById('filterPlan').value;
                const statusFilter = document.getElementById('filterStatus').value;
                
                // Fetch companies from the API
                const response = await fetch('/api/admin/companies', {
                    headers: {
                        'Authorization': `Bearer ${getAdminData()?.token || ''}`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load companies');
                }
                
                const data = await response.json();
                companies = data.companies || [];
                
                // Clear loading message
                companiesTable.innerHTML = '';
                
                if (companies.length === 0) {
                    // No companies found
                    companiesTable.innerHTML = '<tr><td colspan="7" class="text-center">No companies found</td></tr>';
                    return;
                }
                
                // Filter companies
                const filteredCompanies = companies.filter(company => {
                    // Apply search filter
                    const matchesSearch = searchQuery === '' || 
                        (company.company_name && company.company_name.toLowerCase().includes(searchQuery)) ||
                        (company.email && company.email.toLowerCase().includes(searchQuery));
                    
                    // Apply plan filter
                    const matchesPlan = planFilter === '' || company.subscription_plan === planFilter;
                    
                    // Apply status filter
                    const matchesStatus = statusFilter === '' || company.status === statusFilter;
                    
                    return matchesSearch && matchesPlan && matchesStatus;
                });
                
                if (filteredCompanies.length === 0) {
                    companiesTable.innerHTML = '<tr><td colspan="7" class="text-center">No companies match the current filters</td></tr>';
                    return;
                }
                
                // Add companies to the table
                filteredCompanies.forEach(company => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${company.company_name || 'N/A'}</td>
                        <td>${company.email || 'N/A'}</td>
                        <td>${company.phone || 'N/A'}</td>
                        <td><span class="badge bg-${company.subscription_plan === 'enterprise' ? 'success' : company.subscription_plan === 'pro' ? 'primary' : 'secondary'}">${company.subscription_plan || 'basic'}</span></td>
                        <td><span class="badge bg-${company.status === 'active' ? 'success' : company.status === 'pending' ? 'warning' : 'danger'}">${company.status || 'inactive'}</span></td>
                        <td>
                            <a href="/admin/company_features.html?id=${company.id}" class="btn btn-sm btn-outline-info">
                                <i class="bi bi-toggles"></i>
                            </a>
                        </td>
                        <td>
                            <button class="btn btn-sm btn-primary" onclick="viewCompany(${company.id})">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCompany(${company.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    `;
                    companiesTable.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading companies:', error);
                const companiesTable = document.getElementById('companiesTable');
                companiesTable.innerHTML = '<tr><td colspan="7" class="text-center">Failed to load company data. <button class="btn btn-sm btn-link" onclick="loadCompanies()">Try Again</button></td></tr>';
            }
        }

        // View/edit company
        async function viewCompany(companyId) {
            try {
                // Show loading state
                document.getElementById('companyListContainer').style.display = 'none';
                document.getElementById('companyDetailsContainer').style.display = 'block';
                document.getElementById('companyDetailsForm').classList.add('opacity-50');
                document.getElementById('companyDetailsForm').innerHTML = '<div class="text-center py-5"><span class="spinner-border" role="status"></span><p class="mt-2">Loading company details...</p></div>';
                
                // Fetch company details
                const response = await fetch(`/api/admin/companies/${companyId}`, {
                    headers: {
                        'Authorization': `Bearer ${getAdminData()?.token || ''}`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin'
                });
                
                if (!response.ok) {
                    throw new Error('Failed to load company details');
                }
                
                currentCompany = await response.json();
                
                // Populate form
                document.getElementById('companyId').value = currentCompany.id;
                document.getElementById('companyName').value = currentCompany.company_name || '';
                document.getElementById('contactEmail').value = currentCompany.email || '';
                document.getElementById('contactPhone').value = currentCompany.phone || '';
                document.getElementById('website').value = currentCompany.website || '';
                document.getElementById('businessAddress').value = currentCompany.business_address || '';
                document.getElementById('niche').value = currentCompany.niche || '';
                document.getElementById('subscriptionPlan').value = currentCompany.subscription_plan || 'basic';
                document.getElementById('status').value = currentCompany.status || 'inactive';
                
                // Show the form
                document.getElementById('companyDetailsForm').classList.remove('opacity-50');
            } catch (error) {
                console.error('Error loading company details:', error);
                showAlert(`Failed to load company details: ${error.message}`);
                
                // Go back to company list
                document.getElementById('companyListContainer').style.display = 'block';
                document.getElementById('companyDetailsContainer').style.display = 'none';
            }
        }

        // Save company changes
        async function saveCompany(e) {
            e.preventDefault();
            
            if (!currentCompany) {
                showAlert('No company selected to update');
                return;
            }
            
            try {
                // Disable the form during submission
                const saveBtn = document.getElementById('saveCompanyBtn');
                const originalBtnText = saveBtn.innerHTML;
                saveBtn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Saving...';
                saveBtn.disabled = true;
                
                // Get form values
                const companyData = {
                    id: document.getElementById('companyId').value,
                    company_name: document.getElementById('companyName').value,
                    email: document.getElementById('contactEmail').value,
                    phone: document.getElementById('contactPhone').value,
                    website: document.getElementById('website').value,
                    business_address: document.getElementById('businessAddress').value,
                    niche: document.getElementById('niche').value,
                    subscription_plan: document.getElementById('subscriptionPlan').value,
                    status: document.getElementById('status').value
                };
                
                // Update company
                const response = await fetch(`/api/admin/companies/${companyData.id}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${getAdminData()?.token || ''}`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify(companyData)
                });
                
                // Reset button state
                saveBtn.innerHTML = originalBtnText;
                saveBtn.disabled = false;
                
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.message || 'Failed to update company');
                }
                
                showAlert('Company updated successfully', 'success');
                
                // Go back to company list and refresh
                document.getElementById('companyListContainer').style.display = 'block';
                document.getElementById('companyDetailsContainer').style.display = 'none';
                loadCompanies();
            } catch (error) {
                console.error('Error updating company:', error);
                showAlert(`Error updating company: ${error.message}`);
                
                // Reset button state
                const saveBtn = document.getElementById('saveCompanyBtn');
                saveBtn.innerHTML = '<i class="bi bi-save"></i> Save Changes';
                saveBtn.disabled = false;
            }
        }

        // Delete company
        async function deleteCompany(companyId) {
            if (!confirm('Are you sure you want to delete this company? This action cannot be undone.')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/admin/companies/${companyId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${getAdminData()?.token || ''}`,
                        'Content-Type': 'application/json'
                    },
                    credentials: 'same-origin'
                });
                
                if (!response.ok) {
                    const data = await response.json();
                    throw new Error(data.message || 'Failed to delete company');
                }
                
                showAlert('Company deleted successfully', 'success');
                
                // If we're on the company details page, go back to list
                if (document.getElementById('companyDetailsContainer').style.display !== 'none') {
                    document.getElementById('companyListContainer').style.display = 'block';
                    document.getElementById('companyDetailsContainer').style.display = 'none';
                }
                
                // Reload companies list
                loadCompanies();
            } catch (error) {
                console.error('Error deleting company:', error);
                showAlert(`Error deleting company: ${error.message}`);
            }
        }

        // Export companies
        async function exportCompanies() {
            try {
                window.location.href = '/api/admin/companies/export';
            } catch (error) {
                console.error('Error exporting companies:', error);
                showAlert(`Error exporting companies: ${error.message}`);
            }
        }

        // Initialize page
        async function initCompaniesPage() {
            try {
                // Check if admin is authenticated
                const admin = await checkAuth();
                if (!admin) {
                    // Not authenticated, redirect to login
                    window.location.href = '/admin/login.html';
                    return;
                }
                
                // Load companies
                await loadCompanies();
                
                // Setup event listeners
                document.getElementById('refreshCompanies').addEventListener('click', loadCompanies);
                document.getElementById('exportCompanies').addEventListener('click', exportCompanies);
                document.getElementById('applyFilters').addEventListener('click', loadCompanies);
                document.getElementById('backToCompanyList').addEventListener('click', () => {
                    document.getElementById('companyListContainer').style.display = 'block';
                    document.getElementById('companyDetailsContainer').style.display = 'none';
                    currentCompany = null;
                });
                document.getElementById('companyDetailsForm').addEventListener('submit', saveCompany);
                document.getElementById('resetCompanyBtn').addEventListener('click', () => {
                    if (currentCompany) {
                        viewCompany(currentCompany.id);
                    }
                });
                document.getElementById('deleteCompanyBtn').addEventListener('click', () => {
                    if (currentCompany) {
                        deleteCompany(currentCompany.id);
                    }
                });
                document.getElementById('viewFeatures').addEventListener('click', () => {
                    if (currentCompany) {
                        window.location.href = `/admin/company_features.html?id=${currentCompany.id}`;
                    }
                });
                document.getElementById('viewPayments').addEventListener('click', () => {
                    if (currentCompany) {
                        window.location.href = `/admin/payments.html?company_id=${currentCompany.id}`;
                    }
                });
                document.getElementById('viewSupport').addEventListener('click', () => {
                    if (currentCompany) {
                        window.location.href = `/admin/support.html?company_id=${currentCompany.id}`;
                    }
                });
                
                // Setup logout button
                document.getElementById('logout-btn').addEventListener('click', handleLogout);
                
                // Check for company ID in URL
                const urlParams = new URLSearchParams(window.location.search);
                const companyId = urlParams.get('id');
                if (companyId) {
                    viewCompany(companyId);
                }
            } catch (error) {
                console.error('Companies page initialization error:', error);
                showAlert('An error occurred while loading the companies page. Please refresh the page or try again later.');
            }
        }

        // Handle logout
        async function handleLogout(e) {
            e.preventDefault();
            
            try {
                await logout();
                window.location.href = '/admin/login.html';
            } catch (error) {
                console.error('Logout error:', error);
                showAlert('Failed to logout. Please try again.');
            }
        }

        // Initialize the page when DOM is loaded
        document.addEventListener('DOMContentLoaded', initCompaniesPage);
    </script>
</body>
</html>
