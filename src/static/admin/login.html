<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            background-color: #f5f5f5;
        }
        .login-container {
            max-width: 400px;
            width: 100%;
            padding: 15px;
            margin: auto;
        }
        .form-signin {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .form-signin .form-floating:focus-within {
            z-index: 2;
        }
        .error-message {
            display: none;
            color: #dc3545;
            margin-top: 1rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <form class="form-signin" id="loginForm">
            <h1 class="h3 mb-4 fw-normal text-center">Admin Login</h1>
            
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                <label for="email">Email address</label>
            </div>
            
            <div class="form-floating mb-4">
                <input type="password" class="form-control" id="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>

            <div class="error-message" id="errorMessage"></div>
            
            <button class="w-100 btn btn-lg btn-primary" type="submit" id="submitButton">Sign in</button>
        </form>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Check if already logged in
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth().then(admin => {
                if (admin) {
                    // Already logged in, redirect to dashboard
                    const redirectHash = localStorage.getItem('redirectHash') || '';
                    localStorage.removeItem('redirectHash'); // Clear it after use
                    window.location.href = '/admin/dashboard.html' + redirectHash;
                }
            }).catch(error => {
                console.error('Auth check error:', error);
            });

            // Handle hash-based navigation
            const currentHash = window.location.hash;
            if (currentHash) {
                // Store the hash to use after login
                localStorage.setItem('redirectHash', currentHash);
            }
        });

        // Form submission
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('errorMessage');
            const submitButton = document.getElementById('submitButton');
            
            // Display the error message element
            errorElement.style.display = 'block';
            
            try {
                // Disable button and show loading state
                submitButton.disabled = true;
                submitButton.innerHTML = 'Signing in...';
                errorElement.textContent = '';
                
                const admin = await login(email, password);
                if (admin) {
                    // Login successful
                    console.log('Login successful, redirecting to dashboard');
                    const redirectHash = localStorage.getItem('redirectHash') || '';
                    localStorage.removeItem('redirectHash'); // Clear it after use
                    window.location.href = '/admin/dashboard.html' + redirectHash;
                } else {
                    errorElement.textContent = 'Login failed. Please check your credentials.';
                    submitButton.disabled = false;
                    submitButton.innerHTML = 'Sign in';
                }
            } catch (error) {
                console.error('Login error:', error);
                errorElement.textContent = 'An error occurred during login. Please try again.';
                submitButton.disabled = false;
                submitButton.innerHTML = 'Sign in';
            }
        });
    </script>
</body>
</html>
